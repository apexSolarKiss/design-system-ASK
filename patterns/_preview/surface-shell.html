<link rel="stylesheet" href="../surface-shell/surface-shell.css">

<style>
  /* Payload styling belongs to the consuming surface, not to the shell.
     These few rules exist so the specimen shows a payload under the rule;
     replace them wholesale. */
  .payload { display: flex; flex-direction: column; gap: var(--space-4); }
  .payload-block {
    background: var(--surface-glass-2);
    border: 1px solid var(--line-1);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    font-family: var(--font-mono);
    font-size: var(--fs-caption);
    color: var(--fg-2);
  }
  /* The control slot's occupant is skinned by the consuming surface, never by

<body>

<div class="surface">

  <!-- LANDMARKS. header / main / footer are part of the shell contract, not a
       styling choice: they give this page its one banner, one main, and one
       contentinfo landmark, which is how a nonvisual reader skips straight to
       the payload. Every selector below is class-based, so restyling never
       depends on the element — but substituting a <div> silently deletes a
       landmark. -->
  <header class="surface-head">
    <div class="surface-head-main">

      <!-- IDENTITY MARK — consumer-owned. The shell owns the slot's width and
           alignment; the mark inside it is your project's own Tier 3. This
           pattern ships no organization's wordmark, and the placeholder pair
           below is a specimen: replace both children wholesale.

           The accessible name lives on the WRAPPER and nowhere else, so it
           holds through a mode change. A name on the light mark would vanish
           with that element in dark mode, leaving the visible mark unnamed.

           Two children give you a light/dark pairing; the shell shows exactly
           one per resolved mode. A single responsive SVG or <img> is equally
           valid — drop one child and both modifier classes.

           THIS SPECIMEN IS THE NAVIGATION FORM: a native anchor with a real
           home destination and NO role="img", because the image role makes
           descendants presentational and would prune the link from the
           accessibility tree. Keep the child mark assets decorative.

           ONE AUTHORED MARK. Where this surface adopts navigation — that is,
           where the <template class="surface-nav-source"> below is present —
           surface-shell.js upgrades THIS element in place into the navigation
           button and derives the mobile seated placement from the same payload.
           Do not author a second mark. Without JavaScript it stays exactly what
           it is here: an ordinary home link, never a dead control.

           A surface with no navigation and no home destination uses the
           non-interactive form instead — <div class="surface-mark" role="img"
           aria-label="..."> — and omits the source template and the script.
           Both forms are specified in patterns/surface-shell/README.md,
           §The identity mark. -->
      <a class="surface-mark" href="#" aria-label="[consuming organization] home">
        <svg class="surface-mark-light" viewBox="0 0 216 97" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="214" height="95" rx="10" fill="none"
                stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="5 5"/>
          <text x="108" y="55" text-anchor="middle" font-size="16"
                fill="currentColor" fill-opacity="0.7">[light mark]</text>
        </svg>
        <svg class="surface-mark-dark" viewBox="0 0 216 97" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="214" height="95" rx="10" fill="none"
                stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="5 5"/>
          <text x="108" y="55" text-anchor="middle" font-size="16"
                fill="currentColor" fill-opacity="0.7">[dark mark]</text>
        </svg>
      </a>

      <!-- Surface identity. The segment classes grade DEPTH INSIDE A BREADCRUMB
           PATH: .org is the outermost owning / public-root context, an
           intermediate ancestor carries no class, and .page is the inert CURRENT
           LEAF at any depth in that path — a family root that is the page you are
           on takes it exactly as a deep subpage does.

           CURRENTNESS AND LINKABILITY ARE DIFFERENT AXES. A current leaf is
           unlinked BECAUSE it is current; having no href is not why it takes
           .page, and is never a reason to omit .page from a breadcrumb leaf.

           The specimen below is the PLAIN form, so it has no breadcrumb path
           whose depth classes need assigning at all, and its local surface label
           stays unclassed. That is a difference between the two title forms —
           not a destination test, and not an exception for a breadcrumbed family
           root, which does take .page. -->
      <!-- STRUCTURAL TITLE. Two variants — README.md §The structural title.
           The test is PUBLIC ANCESTRY, not local rootedness. Show the complete,
           real, navigable public ancestry from the public family root down to
           this surface.
           PLAIN <h1>, no navigation landmark — shown here — only where there is
           no real navigable public ancestor AT ANY LEVEL. Being the root of your
           own family is not enough: a genuine public parent above that family
           (a studio route above a project, say) IS ancestry and takes a crumb.
           BREADCRUMBED page: wrap this <h1> in
           <nav class="surface-breadcrumb" aria-label="Breadcrumb"> and mark the
           current segment <span class="page" aria-current="page">.
           WITHIN THAT PATH, segment classes grade DEPTH, not kind: .org on the
           outermost owning / public-root context, nothing on an intermediate
           ancestor, and .page on the inert current leaf AT ANY DEPTH in the path
           — a family root that is the page you are on takes .page exactly as a
           deep subpage does. The plain form above has no such path, which is why
           its label is unclassed; that is the form difference, not a rule about
           destinations.
           Linkability is decided by DESTINATION, not by segment class: link a
           segment that is a real ancestor or home, leave a segment with no
           destination of its own static, and never invent a destination to make
           a breadcrumb. [org] is static HERE only because a placeholder has no
           destination — that is the placeholder's topology, not a default. A
           consumer whose organization segment has a real public parent links it,
           as design-system-ASK's own surfaces do. Label a segment with the
           human-facing name of the place it goes, not a repository namespace.
           Every structural separator is `//`, never a single slash, and each is a
           decorative <span class="sep" aria-hidden="true">. -->
      <h1 class="surface-title"><span class="org">[org]</span> <span class="sep" aria-hidden="true">//</span> [repo]</h1>
      <!-- LEDE. One or two calm declarative sentences about this surface. The shell
           sets the foundation's Small supporting-text role — 18px at Light weight
           (300) — and imposes NO measure, so the lede uses the full header width;
           a per-surface measure is the consumer's call.
           Implementation detail belongs in the payload, not here. -->
      <p class="surface-lede">[One or two sentences stating what this surface is and what a reader
        will find below. Plain present tense. The lede describes the surface, not the project.]</p>

      <!-- OPTIONAL status note. Omit the element when the surface carries no
           standing classification. The shell supplies the leading `///`; write
           only your own words here. -->
      <span class="surface-badge">[optional status]</span>

    </div>

    <!-- OPTIONAL control slot, for a payload-specific control such as a
         preview mode selector. Omit the whole element when unused; the shell
         reserves no space for an absent control. The control's own behavior
         and styling belong to the consuming surface. -->
    <div class="surface-head-aside"><span class="slot-demo">[optional control]</span></div>

  </header>

  <hr class="surface-rule">

  <!-- The payload landmark. The shell requires <main> and styles nothing
       inside it; .surface-payload is a hook for your own layout. -->
  <main class="surface-payload payload">
    <div class="payload-block">[payload]</div>
    <div class="payload-block">[payload]</div>
  </main>

  <!-- Footer. Right-aligned by the shell — the reading path ends here. Content
       is the consuming surface's own; the alignment is not a local choice.

       Destinations are COMPACT ACTIONS and stay ANCHORS. surface-action.css owns
       their family, size, weight, tracking, box, foreground and interaction; the
       shell owns only the row. A native <button> would look the same and lose
       the destination, so navigation never becomes one. -->
  <footer class="surface-footer">
    <a class="surface-action surface-action--secondary" href="#">[link]</a>
    <a class="surface-action surface-action--secondary" href="#">[link]</a>
    <a class="surface-action surface-action--secondary" href="#">[link]</a>
  </footer>

  <!-- OPTIONAL RESPONSIVE NAVIGATION. Its presence is what enables the runtime:
       delete this template and the script tag below and the surface declines
       navigation entirely — no panel, no trigger, no terminal reserve, no
       scroll padding, no scrollbar gutter, and the mark above stays a plain
       home anchor.

       ONE PATH SOURCE, PLUS WHAT A PATH CANNOT CONTAIN. The visible structural
       title owns the COMPLETE current public path — every real navigable
       ancestor and the inert current leaf — and the panel derives its vertical
       path from it, never from a second title tree. A breadcrumb cannot supply
       siblings it does not contain, so optional OFF-PATH local destinations are
       authored here instead, once.

       NO PUBLIC ANCESTOR IS REPEATED IN SOURCE CONFIGURATION. A segment on the
       current path belongs in the visible title where a reader can see it, not
       in an attribute only the panel reads. `data-nav-root-*` is legacy runtime
       compatibility for consumers that predate this rule; it is not authored on
       a new surface, and authoring it beside a visible root makes that root
       appear twice in the panel. See README.md. -->
  <template class="surface-nav-source">
    <!-- OPTIONAL local destinations, rendered under the deepest ancestor.

         THE CURRENT PAGE IS NEVER AUTHORED HERE. `data-surface-nav-current` is
         an inert POSITION marker: you say where the current location sits among
         its siblings, and the runtime fills it with the segment derived from
         the visible title above. Writing the label again — or a second
         aria-current — gives the panel an independent current-page source that
         can drift from the visible one, which is precisely what the
         one-authored-path rule prevents.

         SIBLING FORM is shown. For the PARENT form — where this surface is the
         root of its own family and the local destinations are its children —
         nest a <ul> inside the placeholder <li> instead.

         Omit the whole list where the surface has no siblings worth offering. -->
    <ul class="surface-nav-local">
      <li><a href="#">[local destination]</a></li>
      <li data-surface-nav-current></li>
      <li><a href="#">[local destination]</a></li>
    </ul>
    <!-- OPTIONAL utilities — repository, source, external routes. These ARE
         compact actions: they are discrete controls rather than tiers of the
         hierarchy, and rendering the hierarchy as pills would flatten it. -->
    <p class="surface-nav-utilities">
      <a class="surface-action surface-action--secondary" href="#">[utility]</a>
    </p>
  </template>

</div>

<!-- OPTIONAL navigation runtime. Vendored only by surfaces that adopt
     navigation; a declining page ships no copy and loads nothing. -->
<script src="../surface-shell/surface-shell.js"></script>

</body>
