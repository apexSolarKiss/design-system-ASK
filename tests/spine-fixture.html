<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spine behavior fixture</title>
<!-- The behavior fixture of the interactive spine pattern. Served from the repository root by
     tests/spine-behavior.mjs, which drives it with real pointer, touch and wheel input. It is the
     canonical shell's structure loading the owner files by reference, in the shell's order: no
     consumer code and no stub. The fail-closed checks use tests/spine-error-fixture.html. -->
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../spectral-state.css">
<link rel="stylesheet" href="../patterns/diagram-interactive-spine/diagrams-interactive-spine.css">
</head>
<body>

<div class="shell">
  <div class="bar">
    <div class="mark">fixture<span class="sep">/</span>spine</div>
    <div class="title-block">
      <div class="t">Information architecture — state</div>
      <div class="s">state surface · color encodes state only</div>
    </div>
    <div class="spacer"></div>
    <div class="stamp">
      <div><span class="k">source-v1</span> // <span class="k">render-v1</span></div>
      <div>fixture</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="corner-tick tl"></div>
    <div class="corner-tick tr"></div>
    <div class="corner-tick bl"></div>
    <div class="corner-tick br"></div>

    <div class="inspector glass" id="inspector"></div>

    <div class="legend glass">
      <div class="h"><span>State</span></div>
      <div id="legendRows"></div>
    </div>

    <div class="hud glass">
      <button id="zoomOut" title="Zoom out">−</button>
      <div class="pct" id="zoomPct">100%</div>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomFit" title="Fit">⤢</button>
    </div>

    <div class="caption glass">
      <b>illustrative</b> · repo prose is source truth · color encodes state only
    </div>
  </div>
</div>

<script>window.FX = { errors: [] }; window.addEventListener('error', function (e) { window.FX.errors.push(String(e.message)); });</script>
<script src="../patterns/diagram-interactive-spine/diagram-interactive-spine.source.js"></script>
<script src="../patterns/diagram-interactive-spine/diagrams-pointer.js"></script>
<script src="../patterns/diagram-interactive-spine/diagrams-fit.js"></script>
<script src="../patterns/diagram-interactive-spine/diagrams-interactive-spine-engine.js"></script>
<script>
try { window.IA_SPINE.render(window.IA_STATE_SPINE); } catch (err) { window.FX.errors.push(String(err.message)); }
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
